name: rl
version: 2.2.1
summary: Programming language with first-class VM and C transpiler
description: |
  rl-lang is a modern programming language featuring a bytecode VM and
  C transpilation. It includes a REPL, language server, and standard
  library.
base: core24
confinement: classic
license: MIT

architectures:
  - build-on: amd64
  - build-on: arm64

parts:
  rl:
    plugin: rust
    source: https://github.com/rl-lang/rl-lang.git
    source-tag: v2.2.1
    build-packages:
      - pkg-config
      - libssl-dev

apps:
  rl:
    command: bin/rl
  rlc:
    command: bin/rlc
  rlt:
    command: bin/rlt
  rlrepl:
    command: bin/rlrepl
  rlsp:
    command: bin/rlsp
  rldocs:
    command: bin/rldocs
  rlm:
    command: bin/rlm
